services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:root@postgres:5432/transactions
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=info -P solo
    environment:
      DATABASE_URL: postgresql://postgres:root@postgres:5432/transactions
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: AQ.Ab8RN6LXVmPuRTOW2A4WSGP5XkEW-Gkh7F2lZ_S6e1TQ3rF9Fg
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: transactions

  redis:
    image: redis:7